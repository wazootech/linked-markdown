name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build HTML pages
        run: |
          mkdir -p _site
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            dir="$(dirname "$rel")"
            base="$(basename "$rel" .md)"

            if [ "$dir" = "." ]; then
              if [ "$base" = "README" ]; then
                pandoc "$f" -f markdown -t html -s \
                  --metadata title="Linked Markdown Protocol" \
                  -o "_site/index.html"
              fi
              continue
            fi

            mkdir -p "_site/$dir"

            if [ "$base" = "index" ]; then
              out="_site/$dir/index.html"
            elif [ "$base" = "README" ] && [ ! -f "$dir/index.md" ]; then
              out="_site/$dir/index.html"
            else
              out="_site/$dir/$base.html"
            fi

            pandoc "$f" -f markdown -t html -s \
              --metadata title="Linked Markdown Protocol" \
              -o "$out"
          done < <(find . -name '*.md' -not -path './.github/*' -not -path './.git/*' -not -path './_site/*' -not -path './conformance/cases/*' -print0)

          # Copy raw source files alongside their directories for direct linking (paper.md, references.bib, etc.)
          find . \( -name '*.pdf' -o -name '*.bib' -o -name '*.json' -o -name '*.md' \) \
            -not -path './.github/*' -not -path './.git/*' -not -path './_site/*' \
            -not -path './conformance/cases/*' -not -path './node_modules/*' \
            -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            dir="$(dirname "$rel")"
            mkdir -p "_site/$dir"
            cp "$f" "_site/$rel"
          done

          echo '<style>' > _style.html
          cat style.css >> _style.html
          echo '</style>' >> _style.html
          for html in $(find _site -name '*.html'); do
            sed -i '/<\/style>/{
              r _style.html
            }' "$html"
          done
          rm _style.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
